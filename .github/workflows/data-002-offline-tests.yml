name: DATA-002 offline transport tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [fix/data-002-nse-transport]
  workflow_dispatch:

jobs:
  offline-transport-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run offline DATA-002 tests
        run: python -m unittest discover -s tests -p 'test_data_002_*.py' -v
