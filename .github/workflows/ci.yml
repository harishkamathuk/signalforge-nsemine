name: Fork CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "ruff>=0.6,<1"
      - name: Committed diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check HEAD^..HEAD
          fi
      - name: Ruff on changed Python files (legacy baseline deferred)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            DIFF_BASE="$BASE_SHA"
            RANGE="$DIFF_BASE...HEAD"
          else
            RANGE="HEAD^..HEAD"
          fi
          # NUL-delimited names handle whitespace; exclude deletions and renames' old paths.
          mapfile -d '' -t files < <(git diff --diff-filter=ACMR --name-only -z "$RANGE" -- '*.py')
          if [ "${#files[@]}" -gt 0 ]; then
            printf 'Linting %s changed Python file(s)\n' "${#files[@]}"
            ruff check --select E4,E7,E9,F -- "${files[@]}"
          else
            echo "No changed Python files to lint"
          fi
      - name: Offline unit and import tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
